name: Vercel Full Verify Once
on:
  push:
    paths:
      - 'vercel_gateway_full_verify_once.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python vercel_gateway_full_verify_once.py
