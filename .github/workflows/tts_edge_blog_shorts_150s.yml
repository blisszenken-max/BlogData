name: Generate Blog Shorts Korean TTS 150s

on:
  issues:
    types: [reopened]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: blog-shorts-tts-singleton
  cancel-in-progress: false

jobs:
  synthesize:
    if: github.event.issue.number == 61
    runs-on: ubuntu-latest
    steps:
      - name: Capture and scrub TTS request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > /tmp/tts_request.json
          gh api -X PATCH "repos/$REPO/issues/$ISSUE_NUMBER" -f body='[consumed]' >/dev/null
          python - <<'PY'
          import hashlib,json,os
          raw=open('/tmp/tts_request.json','rb').read()
          d=json.loads(raw.decode('utf-8'))
          assert isinstance(d,dict)
          rid=str(d.get('request_id') or '').strip()
          text=str(d.get('text') or '')
          voice=str(d.get('voice') or 'ko-KR-SunHiNeural')
          assert rid and text
          assert voice=='ko-KR-SunHiNeural'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('request_id='+rid+'\n')
              f.write('request_payload_sha256='+hashlib.sha256(raw).hexdigest()+'\n')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install TTS and audio tools
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.2.8
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Generate Korean MP3 and speech timeline
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          REQUEST_PAYLOAD_SHA256: ${{ steps.request.outputs.request_payload_sha256 }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import asyncio, json, os, pathlib
          import edge_tts
          d=json.loads(pathlib.Path('/tmp/tts_request.json').read_text(encoding='utf-8'))
          text=d['text']
          voice=d.get('voice') or 'ko-KR-SunHiNeural'
          request_id=os.environ['REQUEST_ID']
          rate='+20%'; pitch='+0Hz'; volume='+0%'; boundary='WordBoundary'; max_duration_sec=150.0

          async def main():
              communicate=edge_tts.Communicate(text=text,voice=voice,rate=rate,pitch=pitch,volume=volume,boundary=boundary)
              boundaries=[]; idx=0
              with open('narration.mp3','wb') as audio_out:
                  async for chunk in communicate.stream():
                      ctype=chunk.get('type')
                      if ctype=='audio':
                          audio_out.write(chunk['data'])
                      elif ctype=='WordBoundary':
                          offset=int(chunk.get('offset',0)); duration=int(chunk.get('duration',0))
                          boundaries.append({
                              'boundary_id':idx,'type':ctype,'text':chunk.get('text',''),
                              'start_sec':round(offset/10_000_000.0,6),
                              'end_sec':round((offset+duration)/10_000_000.0,6),
                              'duration_sec':round(duration/10_000_000.0,6),
                              'source_offset_or_index':offset,
                          }); idx+=1
              if not boundaries: raise SystemExit('No WordBoundary metadata produced')
              pathlib.Path('speech_timeline.json').write_text(json.dumps({
                  'request_id':request_id,
                  'request_payload_sha256':os.environ['REQUEST_PAYLOAD_SHA256'],
                  'request_issue_number':int(os.environ['ISSUE_NUMBER']),
                  'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
                  'voice':voice,'rate':rate,'pitch':pitch,'volume':volume,'boundary':boundary,
                  'edge_tts_version':'7.2.8','max_duration_sec':max_duration_sec,
                  'boundary_count':len(boundaries),'boundaries':boundaries,
              },ensure_ascii=False,indent=2),encoding='utf-8')
          asyncio.run(main())
          pathlib.Path('request_meta.json').write_text(json.dumps({
              'request_id':request_id,
              'request_payload_sha256':os.environ['REQUEST_PAYLOAD_SHA256'],
              'request_issue_number':int(os.environ['ISSUE_NUMBER']),
              'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
              'voice':voice,'rate':rate,'pitch':pitch,'volume':volume,'boundary':boundary,
              'max_duration_sec':max_duration_sec,
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Verify MP3 and timeline
        run: |
          set -euo pipefail
          test -s narration.mp3
          test -s speech_timeline.json
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,sample_rate,channels -of json narration.mp3 | tee ffprobe.json
          python - <<'PY'
          import json
          d=json.load(open('ffprobe.json',encoding='utf-8'))
          aud=[s for s in d.get('streams',[]) if s.get('codec_type')=='audio']
          assert aud, 'No audio stream'
          duration=float(d['format']['duration'])
          assert 0.2 < duration <= 150.0
          assert int(d['format']['size']) > 1000
          t=json.load(open('speech_timeline.json',encoding='utf-8'))
          assert t.get('voice')=='ko-KR-SunHiNeural'
          assert t.get('rate')=='+20%'
          assert t.get('pitch')=='+0Hz'
          assert t.get('volume')=='+0%'
          assert t.get('boundary')=='WordBoundary'
          b=t.get('boundaries',[])
          assert b and all(x.get('type')=='WordBoundary' for x in b)
          starts=[float(x['start_sec']) for x in b]; ends=[float(x['end_sec']) for x in b]
          assert starts==sorted(starts)
          assert all(e>=s for s,e in zip(starts,ends))
          assert max(ends)<=duration+1.0
          PY

      - name: Upload one-day TTS artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: blog-shorts-korean-tts-${{ github.run_id }}
          path: |
            narration.mp3
            speech_timeline.json
            ffprobe.json
            request_meta.json
          if-no-files-found: error
          retention-days: 1

      - name: Close singleton TTS issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api -X PATCH "repos/$REPO/issues/$ISSUE_NUMBER" -f body='[idle]' -f state=closed >/dev/null
