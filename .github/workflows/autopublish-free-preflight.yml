name: AutoPublish Free Preflight

on:
  push:
    paths:
      - 'autopublish_preflight/**'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check available auth paths without revealing secrets
        env:
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: |
          python - <<'PY'
          import os, json
          yt = all(bool(os.environ.get(k)) for k in ['YT_CLIENT_ID','YT_CLIENT_SECRET','YT_REFRESH_TOKEN'])
          up = bool(os.environ.get('UPLOAD_POST_API_KEY'))
          print(json.dumps({'youtube_direct_credentials_ready': yt, 'upload_post_api_key_ready': up}))
          if not (yt or up):
              raise SystemExit(2)
          PY
