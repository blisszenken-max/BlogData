name: R3 Production Selftest Once
on:
  push:
    paths:
      - '.github/workflows/r3-prod-selftest-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Run fixed production selftest
        env:
          URL: https://blog-data-omega.vercel.app/api/overseas-r3-selftest
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl -sS -o /tmp/result.json -w '%{http_code}' -X POST "$URL" || true)
            if [ "$code" = "200" ] || [ "$code" = "500" ]; then break; fi
            sleep 3
          done
          echo "HTTP=$code"
          cat /tmp/result.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          assert d.get('ok') is True, d
          checks=d.get('checks',{})
          expected=[
            'health_configured','boot','atomic_race_one_winner','stale_token_block','authorize',
            'missing_attestation_block','attested_receipt','evidence_ledger','metric_ledger',
            'unattested_evidence_block','merkle_clause_accept','duplicate_clause_block',
            'early_stage_close_block','ready_before_f18_block'
          ]
          assert all(checks.get(k) is True for k in expected), checks
          print('R3_PRODUCTION_SELFTEST=PASS')
          PY
