name: market-data-transport-once-v77
on:
  push:
    paths:
      - '.github/workflows/market_data_transport_once_v77.yml'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official market data
        shell: bash
        run: |
          set -euo pipefail
          for P in BTC-USD ETH-USD; do
            echo "===${P}_TICKER==="
            curl -A 'Mozilla/5.0' -fsSL "https://api.exchange.coinbase.com/products/${P}/ticker"
            echo
            echo "===${P}_STATS==="
            curl -A 'Mozilla/5.0' -fsSL "https://api.exchange.coinbase.com/products/${P}/stats"
            echo
          done
          echo '===VIX_CSV_TAIL==='
          curl -A 'Mozilla/5.0' -fsSL 'https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv' | tail -n 5
