name: usmarket-photo-discovery-v79-once
on:
  push:
    paths:
      - '.github/workflows/usmarket_photo_asset_discovery_v79_once.yml'
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover official image assets
        shell: python
        run: |
          import urllib.request, urllib.parse, re, html, json
          pages={
            'OIL':'https://www.aramco.com/en/news-media/news/2018/yanbu-south-terminal-export-capacity',
            'ANTHROPIC':'https://www.anthropic.com/company/leadership',
            'WILLIAMS':'https://libertystreeteconomics.newyorkfed.org/2026/04/the-r-labor-share-nexus/',
            'FICO':'https://investors.fico.com/corporate-governance'
          }
          def absu(base,u): return urllib.parse.urljoin(base,html.unescape(u))
          for key,url in pages.items():
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=30) as r:
              text=r.read().decode('utf-8','ignore')
            print('PAGE',key,url)
            metas=re.findall(r'<meta[^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]+content=["\']([^"\']+)',text,re.I)
            metas+=re.findall(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\']',text,re.I)
            for m in metas[:10]: print('META',key,absu(url,m))
            imgs=re.findall(r'<img\b[^>]*>',text,re.I)
            scored=[]
            for tag in imgs:
              sm=re.search(r'\bsrc=["\']([^"\']+)',tag,re.I)
              if not sm: continue
              am=re.search(r'\balt=["\']([^"\']*)',tag,re.I)
              alt=html.unescape(am.group(1)) if am else ''
              src=absu(url,sm.group(1))
              s=(alt+' '+src).lower()
              wanted={'OIL':['yanbu','terminal','tanker','crude'], 'ANTHROPIC':['dario','amodei'], 'WILLIAMS':['williams','john'], 'FICO':['lansing','william','ceo','fair isaac']}[key]
              score=sum(1 for w in wanted if w in s)
              if score: scored.append((score,alt,src))
            for score,alt,src in sorted(scored,reverse=True)[:20]: print('IMG',key,score,alt[:160],src)
