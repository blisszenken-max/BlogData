name: Vercel Secret Verify Once
on:
  push:
    paths:
      - '.github/workflows/vercel-secret-verify-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production secret
        env:
          BASE: https://blog-data-omega.vercel.app
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE/api/overseas-health")
          echo "HTTP=$code"
          cat /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          print('SECRET_CONFIGURED='+str(bool(d.get('secret_configured'))).lower())
          assert d.get('ok') is True
          assert d.get('secret_configured') is True
          PY
