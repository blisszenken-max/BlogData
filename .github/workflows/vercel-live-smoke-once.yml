name: Vercel Live Smoke Once
on:
  push:
    paths:
      - '.github/workflows/vercel-live-smoke-once.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production gateway
        env:
          BASE: https://blog-data-omega.vercel.app
          POLICY_SHA: c12d7cc5a87981d6cc6af52b92fa19c6f5e276a73a37ecf2026984a74fcb0226
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE/api/overseas-health" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 3
          done
          echo "HEALTH_HTTP=$code"
          cat /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d['ok'] is True
          assert d['mode']=='vercel-hobby-merkle-r2'
          assert d['policy_version']=='v9.76'
          assert d['stage_count']==19
          print('SECRET_CONFIGURED='+str(bool(d.get('secret_configured'))).lower())
          PY
          python - <<'PY'
          import json,os
          json.dump({'op':'boot','policy_sha256':os.environ['POLICY_SHA']},open('/tmp/boot_req.json','w'))
          PY
          bcode=$(curl -sS -o /tmp/boot.json -w '%{http_code}' -X POST "$BASE/api/overseas-gateway" -H 'content-type: application/json' --data-binary @/tmp/boot_req.json || true)
          echo "BOOT_HTTP=$bcode"
          cat /tmp/boot.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json')); b=json.load(open('/tmp/boot.json'))
          if h.get('secret_configured'):
              assert b.get('ok') is True and b.get('state_token')
              print('LIVE_BOOT=PASS')
          else:
              assert b.get('ok') is False and b.get('error')=='GATEWAY_SECRET_NOT_CONFIGURED'
              print('LIVE_BOOT=FAIL_CLOSED_SECRET_MISSING')
          PY
