name: TTS Run Receipt Temp

on:
  workflow_run:
    workflows: ["Generate Korean TTS"]
    types: [completed]

permissions:
  contents: write

jobs:
  receipt:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write run receipt
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          mkdir -p tts_run_receipts
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('tts_run_receipts/latest.json')
          p.write_text(json.dumps({
            'run_id': int(os.environ['RUN_ID']),
            'head_sha': os.environ['HEAD_SHA'],
            'conclusion': os.environ['CONCLUSION'],
            'html_url': os.environ['HTML_URL']
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tts_run_receipts/latest.json
          git commit -m "Record TTS workflow run $RUN_ID" || exit 0
          git push
