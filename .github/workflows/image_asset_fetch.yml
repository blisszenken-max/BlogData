name: Fetch Web Image Assets

on:
  push:
    branches: [main]
    paths:
      - 'image_fetch_requests/**'

permissions:
  contents: write

concurrency:
  group: image-fetch-${{ github.sha }}
  cancel-in-progress: false

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow

      - name: Download validate and publish correlated result
        id: fetch_assets
        run: |
          python - <<'PY'
          import hashlib, io, ipaddress, json, os, pathlib, socket, subprocess, time, urllib.parse
          import requests
          from PIL import Image

          before=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          changed=subprocess.check_output(['git','diff','--name-only',before,head,'--','image_fetch_requests/*.json'],text=True).splitlines()
          if not changed: raise SystemExit('No image_fetch_requests JSON changed')
          request_path=changed[-1]
          data=json.loads(pathlib.Path(request_path).read_text(encoding='utf-8'))
          request_id=str(data.get('request_id') or '').strip()
          assets=data.get('assets') or []
          if not request_id or not (1 <= len(assets) <= 5): raise SystemExit('bad request')
          if any(c not in 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-' for c in request_id):
              raise SystemExit('unsafe request_id')

          outdir=pathlib.Path('image_fetch_results')/request_id
          outdir.mkdir(parents=True,exist_ok=True)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f'result_dir={outdir.as_posix()}\n')
          result={'request_id':request_id,'request_path':request_path,'request_commit':head,'assets':[],'pass_count':0,'fail_count':0}
          session=requests.Session(); session.headers.update({'User-Agent':'BlogDataImageFetcher/1.2'})

          def public_https(url):
              p=urllib.parse.urlparse(url)
              if p.scheme!='https' or not p.hostname: raise ValueError('Only public https URLs allowed')
              ips=sorted({x[4][0] for x in socket.getaddrinfo(p.hostname,p.port or 443,type=socket.SOCK_STREAM)})
              if not ips: raise ValueError('DNS returned no address')
              for raw in ips:
                  if not ipaddress.ip_address(raw).is_global: raise ValueError('Non-public target blocked')
          def get(url):
              current=url; total=0
              for hops in range(6):
                  public_https(current)
                  for attempt in range(1,4):
                      total+=1
                      try:
                          r=session.get(current,timeout=(10,25),allow_redirects=False,stream=True)
                          if r.status_code in {429,500,502,503,504} and attempt<3:
                              r.close(); time.sleep(2*attempt); continue
                          if 300 <= r.status_code < 400:
                              loc=r.headers.get('Location')
                              if not loc or hops>=5: raise ValueError('bad redirect')
                              nxt=urllib.parse.urljoin(current,loc); public_https(nxt); r.close(); current=nxt; break
                          r.raise_for_status(); return r,total,hops
                      except (requests.Timeout,requests.ConnectionError):
                          if attempt<3: time.sleep(2*attempt); continue
                          raise
                  else: continue
                  continue
              raise RuntimeError('redirect loop')

          for item in assets:
              asset_id=str(item.get('id') or item.get('asset_id') or '').strip()
              url=str(item.get('url') or '').strip()
              rec={'id':asset_id,'url':url,'status':'FAIL'}
              try:
                  if not asset_id or not url: raise ValueError('id/url missing')
                  public_https(url); r,attempts,hops=get(url); public_https(r.url)
                  raw=b''; maxb=15*1024*1024
                  for chunk in r.iter_content(65536):
                      if chunk:
                          raw+=chunk
                          if len(raw)>maxb: raise ValueError('Image exceeds 15 MB')
                  if len(raw)<256: raise ValueError('too small')
                  img=Image.open(io.BytesIO(raw)); width,height=img.size; fmt=(img.format or '').upper(); img.verify()
                  ext={'JPEG':'.jpg','PNG':'.png','WEBP':'.webp'}.get(fmt)
                  if not ext: raise ValueError('unsupported format')
                  path=outdir/f'{asset_id}{ext}'; path.write_bytes(raw)
                  rec.update(status='PASS',attempts=attempts,redirect_hops=hops,final_url=r.url,format=fmt,decode_status='PASS',width=width,height=height,size_bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),file=str(path))
                  result['pass_count']+=1
              except Exception as e:
                  rec['error']=f'{type(e).__name__}: {e}'; result['fail_count']+=1
              result['assets'].append(rec)
          (outdir/'download_result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit result by request_id
        env:
          RESULT_DIR: ${{ steps.fetch_assets.outputs.result_dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RESULT_DIR"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "image fetch result ${GITHUB_SHA}"
          git push

      - name: Upload correlated image result artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-fetch-results-${{ github.sha }}
          path: ${{ steps.fetch_assets.outputs.result_dir }}
          if-no-files-found: error
