name: Image Asset Fetch Transport

on:
  issues:
    types: [reopened]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: image-asset-fetch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  image:
    if: github.event.issue.number == 60
    runs-on: ubuntu-latest
    steps:
      - name: Capture and scrub request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" > /tmp/request.json
          gh api -X PATCH "repos/$REPO/issues/$ISSUE_NUMBER" -f body='[consumed]' >/dev/null
          python - <<'PY'
          import hashlib,json,os
          raw=open('/tmp/request.json','rb').read(); d=json.loads(raw.decode('utf-8'))
          rid=str(d.get('request_id') or '').strip(); assets=d.get('assets') or []
          assert rid and 1<=len(assets)<=5
          assert all(c in 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-' for c in rid)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('request_id='+rid+'\n'); f.write('request_payload_sha256='+hashlib.sha256(raw).hexdigest()+'\n')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pillow
      - name: Download and validate
        id: fetch_assets
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          REQUEST_PAYLOAD_SHA256: ${{ steps.request.outputs.request_payload_sha256 }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import hashlib,io,ipaddress,json,os,pathlib,socket,time,urllib.parse
          import requests
          from PIL import Image
          data=json.loads(pathlib.Path('/tmp/request.json').read_text(encoding='utf-8')); request_id=os.environ['REQUEST_ID']; assets=data.get('assets') or []
          outdir=pathlib.Path('/tmp/image_fetch_results')/request_id; outdir.mkdir(parents=True,exist_ok=True)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f'result_dir={outdir.as_posix()}\n')
          result={'request_id':request_id,'request_payload_sha256':os.environ['REQUEST_PAYLOAD_SHA256'],'request_issue_number':int(os.environ['ISSUE_NUMBER']),'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'assets':[],'pass_count':0,'fail_count':0}
          session=requests.Session(); session.headers.update({'User-Agent':'BlogDataImageFetcher/1.4'})
          def public_https(url):
              p=urllib.parse.urlparse(url)
              if p.scheme!='https' or not p.hostname: raise ValueError('Only public https URLs allowed')
              ips=sorted({x[4][0] for x in socket.getaddrinfo(p.hostname,p.port or 443,type=socket.SOCK_STREAM)})
              if not ips: raise ValueError('DNS returned no address')
              for raw in ips:
                  if not ipaddress.ip_address(raw).is_global: raise ValueError('Non-public target blocked')
          def get(url):
              current=url; total=0
              for hops in range(6):
                  public_https(current)
                  for attempt in range(1,4):
                      total+=1
                      try:
                          r=session.get(current,timeout=(10,25),allow_redirects=False,stream=True)
                          if r.status_code in {429,500,502,503,504} and attempt<3: r.close(); time.sleep(2*attempt); continue
                          if 300<=r.status_code<400:
                              loc=r.headers.get('Location')
                              if not loc or hops>=5: raise ValueError('bad redirect')
                              nxt=urllib.parse.urljoin(current,loc); public_https(nxt); r.close(); current=nxt; break
                          r.raise_for_status(); return r,total,hops
                      except (requests.Timeout,requests.ConnectionError):
                          if attempt<3: time.sleep(2*attempt); continue
                          raise
                  else: continue
                  continue
              raise RuntimeError('redirect loop')
          for item in assets:
              asset_id=str(item.get('id') or item.get('asset_id') or '').strip(); url=str(item.get('url') or '').strip(); rec={'id':asset_id,'url':url,'status':'FAIL'}
              try:
                  if not asset_id or not url: raise ValueError('id/url missing')
                  public_https(url); r,attempts,hops=get(url); public_https(r.url)
                  buf=io.BytesIO(); maxb=15*1024*1024
                  for chunk in r.iter_content(65536):
                      if chunk:
                          buf.write(chunk)
                          if buf.tell()>maxb: raise ValueError('Image exceeds 15 MB')
                  raw=buf.getvalue()
                  if len(raw)<256: raise ValueError('too small')
                  img=Image.open(io.BytesIO(raw)); width,height=img.size; fmt=(img.format or '').upper(); img.verify()
                  ext={'JPEG':'.jpg','PNG':'.png','WEBP':'.webp'}.get(fmt)
                  if not ext: raise ValueError('unsupported format')
                  path=outdir/f'{asset_id}{ext}'; path.write_bytes(raw)
                  rec.update(status='PASS',attempts=attempts,redirect_hops=hops,final_url=r.url,format=fmt,decode_status='PASS',width=width,height=height,size_bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),file=path.name); result['pass_count']+=1
              except Exception as e:
                  rec['error']=f'{type(e).__name__}: {e}'; result['fail_count']+=1
              result['assets'].append(rec)
          (outdir/'download_result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Print server-side image verification result
        if: always()
        run: |
          if test -f /tmp/image_fetch_results/${{ steps.request.outputs.request_id }}/download_result.json; then
            cat /tmp/image_fetch_results/${{ steps.request.outputs.request_id }}/download_result.json
          else
            echo 'download_result.json unavailable'
          fi
      - name: Upload one-day image result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-fetch-results-${{ github.run_id }}
          path: ${{ steps.fetch_assets.outputs.result_dir }}
          if-no-files-found: warn
          retention-days: 1
      - name: Close singleton issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh api -X PATCH "repos/$REPO/issues/$ISSUE_NUMBER" -f body='[idle]' -f state=closed >/dev/null
