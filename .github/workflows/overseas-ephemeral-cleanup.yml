name: Overseas Ephemeral Cleanup

on:
  push:
    paths:
      - '.github/workflows/overseas-ephemeral-cleanup.yml'
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete image-transport and cleanup runs older than 12 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import datetime, json, os, subprocess
          now=datetime.datetime.now(datetime.timezone.utc)
          cutoff=now-datetime.timedelta(hours=12)
          names={
            'Overseas Image Fetch Transport',
            'Overseas Ephemeral Cleanup',
          }
          repo=os.environ['REPO']; current=str(os.environ['CURRENT_RUN_ID'])
          raw=subprocess.check_output([
              'gh','api','--paginate',
              '-H','Accept: application/vnd.github+json',
              f'repos/{repo}/actions/runs?per_page=100',
              '--jq','.workflow_runs[] | @json'
          ],text=True)
          for line in raw.splitlines():
              if not line.strip(): continue
              run=json.loads(line)
              rid=str(run['id'])
              if rid==current or run.get('name') not in names: continue
              created=datetime.datetime.fromisoformat(run['created_at'].replace('Z','+00:00'))
              if created <= cutoff:
                  subprocess.run(['gh','api','-X','DELETE',f'repos/{repo}/actions/runs/{rid}'],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          PY
