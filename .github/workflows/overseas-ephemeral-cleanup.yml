name: Overseas Ephemeral Cleanup

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete overseas workflow runs older than 12 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import datetime, json, os, subprocess
          now=datetime.datetime.now(datetime.timezone.utc); cutoff=now-datetime.timedelta(hours=12)
          workflows=['overseas-gateway-courier.yml','image_asset_fetch.yml','overseas-ephemeral-cleanup.yml']
          repo=os.environ['REPO']; current=str(os.environ['CURRENT_RUN_ID'])
          for wf in workflows:
              raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/{wf}/runs?per_page=100'],text=True)
              for run in json.loads(raw).get('workflow_runs',[]):
                  rid=str(run['id'])
                  if rid==current: continue
                  created=datetime.datetime.fromisoformat(run['created_at'].replace('Z','+00:00'))
                  if created <= cutoff:
                      subprocess.run(['gh','api','-X','DELETE',f'repos/{repo}/actions/runs/{rid}'],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          PY
