name: R3 Redis CAS Once
on:
  push:
    paths:
      - 'r3_upstash_live_test.mjs'
      - '.github/workflows/r3-upstash-cas-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision temporary Upstash Redis safely
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X POST https://upstash.com/start-redis -H 'User-Agent: chatgpt-openai-r3-validation' > /tmp/upstash.md
          python - <<'PY'
          import os,re,secrets
          s=open('/tmp/upstash.md',encoding='utf-8').read()
          murl=re.search(r'(https://[A-Za-z0-9._-]+\.upstash\.io)',s)
          mtok=re.search(r'(?:UPSTASH_REDIS_REST_TOKEN|KV_REST_API_TOKEN)\s*[=:]\s*[\x60\x22\x27]?([^\x60\x22\x27\s]+)',s)
          if not mtok:
              mtok=re.search(r'Authorization:\s*Bearer\s+([A-Za-z0-9._-]+)',s)
          assert murl and mtok, 'temporary Redis credentials not found'
          url=murl.group(1); tok=mtok.group(1)
          gw=secrets.token_urlsafe(48); ex=secrets.token_urlsafe(48)
          print('::add-mask::'+tok); print('::add-mask::'+gw); print('::add-mask::'+ex)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('UPSTASH_REDIS_REST_URL='+url+'\n')
              f.write('UPSTASH_REDIS_REST_TOKEN='+tok+'\n')
              f.write('TEST_GATEWAY_SECRET='+gw+'\n')
              f.write('TEST_EXECUTOR_SECRET='+ex+'\n')
          PY
      - name: Run actual Redis CAS test
        run: node r3_upstash_live_test.mjs
