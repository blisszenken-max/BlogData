name: Temporary Official Market Data Transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market_data_transport_once.yml'

permissions:
  contents: read

jobs:
  fetch-official-data:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Coinbase and Cboe official data
        run: |
          python - <<'PY'
          import csv, io, json, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          UA='BlogDataMarketFetch/1.0'
          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':UA,'Accept':'*/*'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read(), r.geturl(), r.status

          out={'sources':{},'crypto':{},'vix':{}}

          def crypto(product):
              ticker_url=f'https://api.exchange.coinbase.com/products/{product}/ticker'
              raw, final_url, status=get(ticker_url)
              t=json.loads(raw.decode())
              price=float(t['price']); ts=t['time']; trade_id=t.get('trade_id')
              dt=datetime.fromisoformat(ts.replace('Z','+00:00'))
              target=dt-timedelta(hours=24)
              start=target-timedelta(minutes=3)
              end=target+timedelta(minutes=2)
              def iso(x): return x.astimezone(timezone.utc).isoformat().replace('+00:00','Z')
              q=urllib.parse.urlencode({'start':iso(start),'end':iso(end),'granularity':60})
              candles_url=f'https://api.exchange.coinbase.com/products/{product}/candles?{q}'
              craw, cfinal, cstatus=get(candles_url)
              candles=json.loads(craw.decode())
              candidates=[]
              for row in candles:
                  # [time, low, high, open, close, volume]; time is bucket start epoch seconds
                  st=datetime.fromtimestamp(int(row[0]), tz=timezone.utc)
                  en=st+timedelta(seconds=60)
                  if en <= target:
                      candidates.append((en,float(row[4]),int(row[0])))
              if not candidates:
                  raise RuntimeError(f'No completed 1m base candle for {product}')
              base_ts, base_price, base_start=max(candidates,key=lambda x:x[0])
              drift=(target-base_ts).total_seconds()
              pct=(price/base_price-1)*100
              return {
                'product':product,'price':price,'time':ts,'trade_id':trade_id,
                'ticker_url':ticker_url,'ticker_http_status':status,
                'base_target_ts':iso(target),'base_price':base_price,'base_ts':iso(base_ts),
                'base_drift_sec':drift,'change_pct_24h':pct,'candles_url':candles_url,
                'candles_http_status':cstatus
              }

          out['crypto']['BTC-USD']=crypto('BTC-USD')
          out['crypto']['ETH-USD']=crypto('ETH-USD')

          vix_url='https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv'
          raw, final_url, status=get(vix_url)
          text=raw.decode('utf-8-sig')
          rows=list(csv.DictReader(io.StringIO(text)))
          def find_date(ds):
              for r in rows:
                  if r.get('DATE')==ds:
                      return r
              return None
          target=find_date('09/28/2026')
          prev=find_date('09/25/2026')
          if not target or not prev:
              raise RuntimeError(f'VIX target/prev missing target={target} prev={prev}; last={rows[-3:]}')
          tc=float(target['CLOSE']); pc=float(prev['CLOSE'])
          out['vix']={'date':'09/28/2026','close':tc,'previous_date':'09/25/2026','previous_close':pc,'change_pct':(tc/pc-1)*100,'source_url':vix_url,'http_status':status}
          out['sources']['coinbase']='https://api.exchange.coinbase.com'
          out['sources']['cboe']=vix_url
          print('MARKET_DATA_JSON='+json.dumps(out, ensure_ascii=False, separators=(',',':')))
          open('market_data_result.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: market-data-once
          path: market_data_result.json
          retention-days: 1
