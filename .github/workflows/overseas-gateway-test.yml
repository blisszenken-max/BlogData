name: Overseas Gateway Test

on:
  push:
    branches: [main, overseas-gateway-hobby-r1]
    paths:
      - 'overseas-gateway/**'
      - 'offmuse-site/api/overseas-*.mjs'
      - 'offmuse-site/gateway/**'
      - '.github/workflows/overseas-gateway-test.yml'
  pull_request:
    paths:
      - 'overseas-gateway/**'
      - 'offmuse-site/api/overseas-*.mjs'
      - 'offmuse-site/gateway/**'
      - '.github/workflows/overseas-gateway-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overseas-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

      - name: Smoke test Vercel gateway
        env:
          PREVIEW_URL: https://blog-data-git-overseas-gateway-hobby-r1-blisszenken-9114.vercel.app
          PROD_URL: https://blog-data-omega.vercel.app
          POLICY_SHA: c12d7cc5a87981d6cc6af52b92fa19c6f5e276a73a37ecf2026984a74fcb0226
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then BASE="$PROD_URL"; else BASE="$PREVIEW_URL"; fi
          HEALTH_CODE=$(curl -LsS --max-redirs 5 -D /tmp/health.headers -o /tmp/health.json -w '%{http_code}' "$BASE/api/overseas-health")
          echo "health HTTP=$HEALTH_CODE bytes=$(wc -c </tmp/health.json)"
          cat /tmp/health.headers
          echo "health body:"
          cat /tmp/health.json || true
          echo
          test -s /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d['ok'] is True
          assert d['policy_version']=='v9.76'
          assert d['stage_count']==19
          assert d['policy_sha256']=='c12d7cc5a87981d6cc6af52b92fa19c6f5e276a73a37ecf2026984a74fcb0226'
          print('health PASS', d)
          PY
          python - <<'PY'
          import json, os
          with open('/tmp/request.json','w') as f:
              json.dump({'op':'boot','policy_sha256':os.environ['POLICY_SHA']}, f)
          PY
          HTTP_CODE=$(curl -LsS --max-redirs 5 -D /tmp/boot.headers -o /tmp/boot.json -w '%{http_code}' -X POST "$BASE/api/overseas-gateway"             -H 'content-type: application/json'             --data-binary @/tmp/request.json)
          echo "gateway HTTP=$HTTP_CODE"
          cat /tmp/boot.headers
          echo "gateway body:"
          cat /tmp/boot.json || true
          echo
          test -s /tmp/boot.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          b=json.load(open('/tmp/boot.json'))
          if h.get('secret_configured'):
              assert b.get('ok') is True and b.get('state_token')
              print('secret configured: signed boot PASS')
          else:
              assert b.get('ok') is False and b.get('error')=='GATEWAY_SECRET_NOT_CONFIGURED'
              print('secret absent: fail-closed PASS')
          PY
