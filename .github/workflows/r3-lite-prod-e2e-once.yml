name: R3 Lite Production E2E Once
on:
  push:
    paths:
      - 'r3_lite_prod_e2e.py'
      - '.github/workflows/r3-lite-prod-e2e-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python r3_lite_prod_e2e.py
