<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>OFFMUSE | 관리자 투표 집계</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#263029;background:#f7f4ef}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.wrap{max-width:980px;margin:auto}h1{font-size:clamp(24px,4vw,36px);font-weight:600;letter-spacing:-.04em}p{line-height:1.65;color:#5f665f}.panel{background:white;border:1px solid #e5e2db;border-radius:18px;padding:24px;box-shadow:0 2px 18px #00000009}label{display:block;font-weight:650;font-size:14px;margin-bottom:7px}input{font:inherit;width:100%;padding:13px;border:1px solid #cacac5;border-radius:8px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}button{background:#25342d;border:0;color:#fff;font:inherit;border-radius:9px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#eceeea;color:#263029}.error{color:#b02d31}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}.metric{flex:1;min-width:170px;padding:18px;background:#fff;border:1px solid #e5e2db;border-radius:12px}.metric b{font-size:26px;display:block;margin-top:5px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:570px}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #e5e2db}th{color:#6f766e;font-size:13px}td:nth-child(n+4){font-variant-numeric:tabular-nums}small{color:#727970}.hidden{display:none}footer{padding:28px 0}a{color:inherit}
</style></head><body><main class="wrap"><small>OFFMUSE · PRIVATE ADMIN</small><h1>음악 선호도 투표 집계</h1><p>Upstash Redis에 저장된 실제 투표수를 읽습니다. 비밀키는 브라우저에 저장하지 않으며, 입력된 값은 인증 요청에만 사용됩니다.</p>
<section class="panel"><label for="secret">관리자 조회 비밀키</label><input type="password" id="secret" autocomplete="off" spellcheck="false" placeholder="관리자 조회키 입력"><div class="actions"><button id="load">집계 새로고침</button><button id="export" class="secondary" disabled>CSV 저장</button><button id="hide" class="secondary">키 지우기</button></div><p id="msg" role="status" aria-live="polite">관리자 비밀키 입력 후 집계를 불러오세요.</p></section>
<section id="results" class="hidden"><div class="summary"><div class="metric">등록된 곡 수<b id="songs">–</b></div><div class="metric">총 투표 수<b id="votes">–</b></div><div class="metric">집계 갱신<b id="time" style="font-size:17px">–</b></div></div><div class="panel scroll"><table><thead><tr><th>곡명</th><th>버전</th><th>투표수</th><th>곡 총투표수</th><th>득표율</th></tr></thead><tbody id="body"></tbody></table></div></section>
<footer><small>홈페이지 투표는 반복 참여가 가능합니다. 관리자 화면은 투표 내용만 조회하며 변경하지 않습니다. <a href="/">OFFMUSE로 돌아가기</a></small></footer></main>
<script>
(()=>{"use strict";const q=id=>document.getElementById(id);let csv="";
function decodeCSV(source){const rows=[];let row=[],field="",quoted=false;source=source.replace(/^\uFEFF/,"");for(let i=0;i<source.length;i++){const c=source[i];if(quoted){if(c==='"'&&source[i+1]==='"'){field+='"';i++;}else if(c==='"')quoted=false;else field+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(field);field="";}else if(c==='\n'){row.push(field.replace(/\r$/,""));rows.push(row);row=[];field="";}else field+=c;}if(field||row.length){row.push(field);rows.push(row);}return rows;}
function message(s,error){q("msg").textContent=s;q("msg").className=error?"error":"";}
async function getReport(){const secret=q("secret").value.trim();if(!secret){message("관리자 조회키를 입력하세요.",true);return;}q("load").disabled=true;message("Redis 집계를 불러오는 중입니다…");
try{const r=await fetch("/api/vote?results=csv",{headers:{"Authorization":"Bearer "+secret},cache:"no-store"});if(!r.ok)throw Error(r.status===403?"조회키가 일치하지 않습니다.":"투표 집계를 읽을 수 없습니다 (HTTP "+r.status+").");const raw=await r.text(),rows=decodeCSV(raw).slice(1);if(!rows.length||rows[0][0]!=="song_id"&&rows.some(a=>a.length<6))throw Error("예상치 못한 집계 형식입니다.");csv=raw;const data=rows.filter(a=>a.length>=6),unique=[...new Set(data.map(a=>a[0]))],total=unique.reduce((sum,id)=>sum+Number(data.find(a=>a[0]===id)?.[4]||0),0);q("songs").textContent=unique.length.toLocaleString("ko-KR");q("votes").textContent=total.toLocaleString("ko-KR");q("time").textContent=new Date().toLocaleString("ko-KR");const tbody=q("body");tbody.replaceChildren();for(const row of data){const tr=document.createElement("tr");for(const idx of [1,2,3,4,5]){const td=document.createElement("td");td.textContent=idx===5?Number(row[idx]||0).toFixed(2)+"%":row[idx];tr.append(td);}tbody.append(tr);}q("results").classList.remove("hidden");q("export").disabled=false;message("Redis에서 직접 조회한 집계입니다. 새로고침하면 다시 읽습니다.");}
catch(e){message(e.message||"조회 실패",true);}
finally{q("load").disabled=false;}}
q("load").addEventListener("click",getReport);q("secret").addEventListener("keydown",e=>{if(e.key==="Enter")getReport();});q("hide").addEventListener("click",()=>{q("secret").value="";csv="";q("export").disabled=true;q("results").classList.add("hidden");message("관리자 비밀키와 현재 집계를 화면에서 지웠습니다.");});q("export").addEventListener("click",()=>{if(!csv)return;const a=document.createElement("a"),url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.href=url;a.download="OFFMUSE_vote_results.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
})();
</script></body></html>
