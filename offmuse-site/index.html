<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111715">
  <meta name="description" content="Noah & Zoe(노아지오). 글이 노래가 될 때. 사랑과 기억, 일상의 이야기를 음악으로 전합니다.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Noah & Zoe">
  <meta property="og:title" content="Noah & Zoe · 노아지오">
  <meta property="og:description" content="글이 노래가 될 때. 사랑과 기억, 일상의 이야기를 음악으로 전합니다.">
  <meta property="og:url" content="https://offmuse.com/">
  <meta name="color-scheme" content="dark">
  <title>Noah & Zoe | 노아지오</title>
  <style>
    :root {
      --bg: #111715; --paper: #f5f1e9; --muted: #c4c0b4;
      --gold: #d7b58e; --rule: rgba(233,221,202,.2);
      --serif: Georgia,"Times New Roman",serif;
      --sans: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-width: 320px; min-height: 100vh; margin: 0; color: var(--paper);
      background: var(--bg); font-family: var(--sans); -webkit-font-smoothing: antialiased;
    }
    body::before {
      position: fixed; inset: 0; z-index: -1; content: ""; pointer-events: none;
      background: radial-gradient(ellipse 65% 70% at 82% 47%,rgba(83,87,68,.21),transparent 74%),
                  radial-gradient(ellipse 50% 45% at 15% 0%,rgba(68,76,65,.11),transparent 70%);
    }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; }
    .skip { position: absolute; top: -100px; left: 16px; z-index: 5; padding: 10px 14px; background: var(--paper); color: var(--bg); }
    .skip:focus { top: 16px; }
    .shell {
      max-width: 1560px; min-height: 100vh; min-height: 100svh;
      margin: auto; padding: 31px clamp(24px,5.4vw,90px) 24px;
      display: flex; flex-direction: column;
    }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-bottom: 23px; border-bottom: 1px solid var(--rule); }
    .brand { display: inline-flex; align-items: center; gap: 13px; text-decoration: none; }
    .brand-mark { display: inline-grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--gold); border-radius: 50%; color: var(--gold); font-family: var(--serif); font-size: .84rem; letter-spacing: -.05em; }
    .brand-name { display: flex; flex-direction: column; gap: 5px; font-weight: 700; font-size: .77rem; letter-spacing: .15em; }
    .brand-name small { color: var(--muted); font-weight: 500; font-size: .62rem; letter-spacing: .21em; }
    .nav-link { display: inline-flex; align-items: center; gap: 9px; font-size: .75rem; font-weight: 600; letter-spacing: .14em; text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 4px; }
    .nav-link:hover { border-color: var(--gold); color: var(--gold); }
    .nav-link span { color: var(--gold); font-size: 1.1rem; }
    .hero {
      width: 100%; flex: 1; display: grid; grid-template-columns: minmax(0,1.08fr) minmax(0,.92fr);
      align-items: center; gap: 24px; min-height: 640px; padding: 60px 0 76px;
    }
    .intro { position: relative; z-index: 2; }
    .eyebrow { color: var(--gold); font-size: .72rem; letter-spacing: .28em; font-weight: 650; margin: 0 0 clamp(26px,4vh,42px); display: flex; align-items: center; gap: 14px; }
    .eyebrow::before { content:""; display: block; width: 25px; height: 1px; background: var(--gold); }
    h1 {
      margin: 0; font-family: var(--serif); font-size: clamp(5.1rem,9vw,10rem);
      font-weight: 400; line-height: .87; letter-spacing: -.084em;
    }
    h1 span { display: block; }
    h1 .second { margin-left: .3em; white-space: nowrap; }
    h1 em { font-weight: 400; font-style: italic; color: var(--gold); }
    .korean { margin: 24px 0 0; font-size: clamp(1.15rem,1.9vw,1.6rem); letter-spacing: .33em; font-weight: 500; }
    .copy { margin: clamp(37px,6vh,60px) 0 30px; padding-left: 22px; border-left: 1px solid var(--gold); }
    .copy h2 { font-size: clamp(1.3rem,2vw,1.8rem); letter-spacing: -.065em; line-height: 1.48; font-weight: 550; margin: 0 0 9px; }
    .copy p { color: var(--muted); font-size: clamp(.87rem,1.08vw,1rem); line-height: 1.85; margin: 0; word-break: keep-all; }
    .listen {
      display: inline-flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 19px 0 20px;
      color: #18201c; background: var(--gold); border: 1px solid var(--gold); border-radius: 2px;
      font-size: .94rem; font-weight: 750; text-decoration: none;
      transition: transform .2s ease,background .2s ease,color .2s ease;
    }
    .listen:hover { transform: translateY(-3px); background: var(--paper); border-color: var(--paper); }
    .listen svg { display:block; flex: none; }
    .listen .exit { margin-left: 20px; font-size: 1.1rem; font-weight: 400; }
    .art { position: relative; display: grid; place-items: center; min-width: 0; align-self: stretch; isolation: isolate; }
    .art::before { content: ""; position: absolute; z-index: -1; width: 108%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle,rgba(205,170,123,.11),transparent 65%); filter: blur(15px); }
    .vinyl {
      position: relative; width: min(100%,600px); aspect-ratio: 1; border-radius: 50%;
      background:
        radial-gradient(circle at 35% 26%,rgba(255,255,255,.14),transparent 24%),
        repeating-radial-gradient(circle at center,rgba(185,179,163,.085) 0 1px,transparent 1px 6px),
        conic-gradient(from -28deg,#1a211e,#2d322b 14%,#0d1210 25%,#252b25 40%,#111715 53%,#33362f 68%,#131a17 79%,#30332b 92%,#1a211e);
      border: 1px solid rgba(216,208,187,.26);
      box-shadow: 0 21px 65px rgba(0,0,0,.35), inset 0 0 20px rgba(0,0,0,.8),inset 0 0 0 6px rgba(0,0,0,.24);
    }
    .vinyl::before { content: ""; position: absolute; inset: 10%; border: 1px solid rgba(221,212,192,.11); border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.24), 0 0 0 15px rgba(0,0,0,.025); }
    .label {
      position: absolute; inset: 34%; border-radius: 50%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; text-align: center;
      border: 1px solid rgba(25,32,27,.7);
      background: radial-gradient(circle at 30% 23%,#ead8b6,#c7ac87 65%,#aa8d69);
      box-shadow: 0 1px 13px rgba(0,0,0,.55);
      color: #242b25;
    }
    .label b { font-family: var(--serif); font-size: clamp(1rem,1.8vw,1.8rem); font-weight: 500; letter-spacing: -.055em; line-height: 1.1; }
    .label small { font-size: clamp(.36rem,.6vw,.58rem); letter-spacing: .17em; font-weight: 750; }
    .label::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #2e352e; }
    .art-caption { position:absolute; right: 0; bottom: clamp(10px,4vh,46px); color: var(--muted); font-size: .63rem; letter-spacing: .18em; writing-mode: vertical-rl; }
    .foot { display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:21px;border-top:1px solid var(--rule);font-size:.7rem;letter-spacing:.11em;color:var(--muted); }
    .foot a { text-decoration: none; }
    .foot a:hover { color:var(--gold); text-decoration: underline; text-underline-offset: 4px; }
    @media(max-width:1100px) {
      .hero { grid-template-columns: minmax(0,1.08fr) minmax(0,.92fr); min-height:550px; gap: 5px; }
      h1 { font-size: clamp(4.6rem,8.7vw,7.5rem); }
      .vinyl { width: 100%; }
    }
    @media(max-width:740px) {
      .shell { padding: 23px 24px 22px; }
      .masthead { padding-bottom: 17px; }
      .brand-mark { width: 37px; height: 37px; }
      .brand-name { font-size: .71rem; }
      .nav-link { font-size: .64rem; letter-spacing: .045em; }
      .hero { display:flex; flex-direction:column;align-items:stretch;min-height:0;padding:64px 0 52px;gap: 52px; }
      .eyebrow { margin-bottom: 25px; font-size:.65rem; }
      h1 { font-size: clamp(4.1rem,14vw,6.5rem); }
      .korean { margin-top: 20px; font-size: 1.16rem; }
      .copy { margin: 36px 0 27px; }
      .copy p { max-width: 370px; }
      .art { width: min(76vw,350px); margin:0 auto; align-self:center; }
      .vinyl { width: 100%; }
      .label b { font-size: clamp(1rem,5vw,1.7rem); }
      .label small { font-size:.5rem; }
      .art-caption { right:-12px;bottom:9px; }
    }
    @media(max-width:380px) {
      .brand-name small { letter-spacing: .09em; }
      .nav-link { font-size: .6rem; }
      h1 { font-size: 3.95rem; }
      .foot { font-size:.64rem; }
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.listen{transition:none}.listen:hover{transform:none}}
  </style>
</head>
<body>
  <a href="#main" class="skip">본문 바로가기</a>
  <div class="shell">
    <header class="masthead">
      <a href="/" class="brand" aria-label="Noah & Zoe 홈">
        <span class="brand-mark" aria-hidden="true">N·Z</span>
        <span class="brand-name">NOAH &amp; ZOE<small>노아지오</small></span>
      </a>
      <a class="nav-link" href="https://www.youtube.com/playlist?list=PLqTffGOChCZdmFseXRsY5553QV4U2bsfD" target="_blank" rel="noopener noreferrer">YOUTUBE <span aria-hidden="true">↗</span></a>
    </header>
    <main class="hero" id="main">
      <section class="intro" aria-labelledby="hero-title">
        <p class="eyebrow">MUSIC &amp; STORIES</p>
        <h1 id="hero-title"><span>Noah</span><span class="second"><em>&amp;</em> Zoe</span></h1>
        <p class="korean">노아지오</p>
        <div class="copy">
          <h2>글이 노래가 될 때.</h2>
          <p>사랑과 기억, 일상의 이야기를 음악으로 전합니다.</p>
        </div>
        <a class="listen" href="https://www.youtube.com/playlist?list=PLqTffGOChCZdmFseXRsY5553QV4U2bsfD" target="_blank" rel="noopener noreferrer" aria-label="노아지오 음악을 YouTube에서 듣기 (새 창)">
          <svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4 2.8L17 10 4 17.2V2.8Z" fill="currentColor"/></svg>
          <span>YouTube에서 음악 듣기</span><span class="exit" aria-hidden="true">↗</span>
        </a>
      </section>
      <div class="art" aria-hidden="true">
        <div class="vinyl"><div class="label"><small>MUSIC &amp; STORIES</small><b>Noah<br>&amp; Zoe</b></div></div>
        <span class="art-caption">AN EVERYDAY SOUNDTRACK</span>
      </div>
    </main>
    <footer class="foot"><span>© NOAH &amp; ZOE</span><a href="/privacy/">PRIVACY</a></footer>
  </div>
</body>
</html>
