<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <meta name="description" content="Noah & Zoe(노아지오). 글이 노래가 될 때. 사랑과 기억, 일상의 이야기를 음악으로 전합니다.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Noah & Zoe — 노아지오">
  <meta property="og:description" content="글이 노래가 될 때. 사랑과 기억, 일상의 이야기를 음악으로 전합니다.">
  <meta property="og:site_name" content="Noah & Zoe">
  <meta property="og:url" content="https://offmuse.com/">
  <title>Noah & Zoe | 노아지오</title>
  <style>
    :root{color-scheme:dark;--bg:#11110f;--fg:#f4f0e8;--soft:#b5afa5;--line:#393833;--accent:#cfb98c}
    *{box-sizing:border-box}
    html{min-height:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    .page{min-height:100vh;min-height:100svh;max-width:1440px;margin:auto;display:flex;flex-direction:column;padding:38px clamp(24px,6.2vw,96px) 30px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px}
    .wordmark{font-size:.85rem;font-weight:740;letter-spacing:.23em;text-decoration:none}
    .top-note{color:var(--soft);font-size:.74rem;letter-spacing:.22em}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:86px 0 100px}
    .eyebrow{font-size:.78rem;color:var(--accent);letter-spacing:.34em;font-weight:700;margin:0 0 24px}
    h1{font-weight:650;letter-spacing:-.078em;font-size:clamp(4rem,12.5vw,12rem);line-height:.92;margin:0;max-width:1200px}
    .ko{font-size:clamp(1.2rem,2.5vw,2.05rem);font-weight:470;letter-spacing:.33em;color:var(--soft);margin:26px 0 0}
    .rule{height:1px;width:min(520px,100%);background:var(--line);margin:45px 0 37px}
    h2{font-family:Georgia,"Noto Serif KR",serif;font-weight:400;font-size:clamp(1.6rem,3.2vw,2.65rem);letter-spacing:-.05em;line-height:1.4;margin:0}
    .desc{color:var(--soft);font-size:clamp(.95rem,1.25vw,1.08rem);letter-spacing:-.02em;line-height:1.9;margin:13px 0 32px}
    .cta{display:inline-flex;align-items:center;gap:26px;border:1px solid var(--accent);text-decoration:none;color:var(--fg);padding:16px 20px 16px 23px;font-size:.95rem;font-weight:650;transition:background .18s,color .18s,transform .18s}
    .cta:hover,.cta:focus-visible{background:var(--accent);color:var(--bg);transform:translateY(-2px)}
    .cta:focus-visible,.footer a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .cta .arrow{font-size:1.15rem;line-height:1}
    .footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:19px;color:var(--soft);font-size:.75rem;letter-spacing:.08em}
    .footer a{color:var(--soft);text-decoration:none}
    .footer a:hover{text-decoration:underline}
    @media(max-width:700px){.page{padding:24px 24px 22px}.top-note{font-size:.65rem;letter-spacing:.1em}main{padding:100px 0}.eyebrow{font-size:.7rem}h1{font-size:clamp(3.8rem,17vw,6.6rem);letter-spacing:-.07em}.ko{font-size:1.1rem;margin-top:22px}.rule{margin:35px 0 31px}.footer{font-size:.68rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="wordmark" href="/" aria-label="Noah & Zoe 홈">N&amp;Z</a>
      <span class="top-note">MUSIC &amp; STORIES</span>
    </header>
    <main id="content">
      <p class="eyebrow">WORDS INTO MUSIC</p>
      <h1>NOAH<br>&amp; ZOE</h1>
      <p class="ko">노아지오</p>
      <div class="rule" aria-hidden="true"></div>
      <h2>글이 노래가 될 때.</h2>
      <p class="desc">사랑과 기억, 일상의 이야기를 음악으로 전합니다.</p>
      <a class="cta" href="https://www.youtube.com/playlist?list=PLqTffGOChCZdmFseXRsY5553QV4U2bsfD" target="_blank" rel="noopener noreferrer" aria-label="YouTube에서 노아지오의 음악 듣기 (새 창)">
        <span>YouTube에서 음악 듣기</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </main>
    <footer class="footer"><span>© NOAH &amp; ZOE</span><a href="/privacy/">Privacy</a></footer>
  </div>
</body>
</html>
